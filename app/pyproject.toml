[project]
name = "finapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "lxml>=5.0",
  "python-dateutil>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["household: start from the invented household setup (tests/fixtures/household_setup.json)"]
pythonpath = ["."]
